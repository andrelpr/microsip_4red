# /etc/nginx/sites-available/prov.conf
# Certificado valido e obrigatorio: o MicroSIP valida o TLS do provisionamento.
server {
    listen 443 ssl http2;
    server_name prov.suaempresa.com.br;

    ssl_certificate     /etc/letsencrypt/live/prov.suaempresa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prov.suaempresa.com.br/privkey.pem;

    access_log off;   # a URL nao tem segredo, mas evita guardar log por ramal em dobro

    location /microsip/v1/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
